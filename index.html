    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Claude Swarm",
        "url": "https://meridian-knight.github.io/claude-swarm/",
        "image": "https://meridian-knight.github.io/claude-swarm/social-preview.png",
        "description": "Eat tokens, spawn Claude-inspired bots and grow your swarm. A free, retro Snake-inspired fan game for desktop and mobile.",
        "genre": "Arcade",
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "isAccessibleForFree": true,
        "inLanguage": "en",
        "author": { "@type": "Organization", "name": "North of Zero" }
      }
    </script>
  </head>
  <body data-status="idle">
    <main class="handheld">
      <header class="hud">
        <h1 class="title">Claude Swarm</h1>
        <dl class="stats">
          <div class="stat"><dt>Score</dt><dd id="score">0</dd></div>
          <div class="stat"><dt>Best</dt><dd id="best">0</dd></div>
          <div class="stat"><dt>Bots</dt><dd id="bots">1</dd></div>
        </dl>
        <div class="hud-buttons">
          <button id="help-btn" class="chip" type="button" aria-label="How to play" aria-haspopup="dialog" aria-expanded="false" aria-controls="help" title="How to play" data-deck-label="B · Help">?</button>
          <button id="pause-btn" class="chip" type="button" aria-label="Pause" title="Pause (Space)" data-deck-label="A · Pause" disabled>❚❚</button>
          <button id="mute-btn" class="chip" type="button" aria-label="Mute sound" aria-pressed="false" title="Toggle sound" data-deck-label="Sound">🔊</button>
        </div>
      </header>

      <section class="screen" id="screen">
        <canvas id="board" width="480" height="480" aria-label="Game board"></canvas>
        <div id="effects" class="effects" aria-live="polite"></div>

        <div id="overlay" class="overlay" role="dialog" aria-labelledby="overlay-title">
          <canvas id="mascot" class="mascot" width="72" height="72" aria-hidden="true"></canvas>
          <p class="eyebrow">Unofficial fan game</p>
          <h2 id="overlay-title">Claude Swarm</h2>
          <p id="overlay-text" class="overlay-text"></p>
          <div id="overlay-controls" class="controls"></div>
          <p id="overlay-keys" class="keys"></p>
          <button id="action-btn" class="action" type="button">Start</button>
        </div>

      </section>

      <section class="deck" id="deck" aria-label="Touch controls">
        <nav class="dpad" aria-label="Direction pad">
          <button type="button" class="dpad-btn up" data-dir="up" aria-label="Up">▲</button>
          <button type="button" class="dpad-btn left" data-dir="left" aria-label="Left">◀</button>
          <span class="dpad-center" aria-hidden="true"></span>
          <button type="button" class="dpad-btn right" data-dir="right" aria-label="Right">▶</button>
          <button type="button" class="dpad-btn down" data-dir="down" aria-label="Down">▼</button>
        </nav>
        <div class="deck-right">
          <div class="ab" id="deck-ab"></div>
          <div class="pill-row" id="deck-pills"></div>
        </div>
      </section>

        <div id="help" class="modal" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden>
        <div class="modal-panel">
          <h2 id="help-title">How to play</h2>
          <div id="help-controls" class="controls"></div>
          <ul class="rules">
            <li>Collect tokens to score.</li>
            <li>Every token adds a bot to your chain.</li>
            <li>Avoid the walls and your own swarm.</li>
          </ul>
          <button id="help-close" class="action" type="button">Close</button>
        </div>
      </div>

      <footer class="foot">
        <p class="legal">A fan game developed by North of Zero and Claude.</p>
        <p class="legal">Not affiliated with or endorsed by Anthropic.</p>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
